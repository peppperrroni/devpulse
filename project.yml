name: DevPulse
options:
  bundleIdPrefix: com.peppperrroni
  deploymentTarget:
    macOS: "26.0"
packages:
  DevPulseCore:
    path: Packages/DevPulseCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  DevPulse:
    type: application
    platform: macOS
    sources:
      - DevPulseApp
    dependencies:
      - package: DevPulseCore
    info:
      path: DevPulseApp/Info.plist
      properties:
        CFBundleDisplayName: DevPulse
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ru
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peppperrroni.devpulse
        PRODUCT_NAME: DevPulse
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"   # ad-hoc; scripts/install.sh signs with your Apple Development identity
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_STRICT_CONCURRENCY: complete
