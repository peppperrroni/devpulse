name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Test core
        run: swift test --package-path Packages/DevPulseCore
      - name: Build app (Release, ad-hoc signed)
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project DevPulse.xcodeproj -scheme DevPulse -configuration Release \
            -derivedDataPath build build
